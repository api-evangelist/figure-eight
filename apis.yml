name: Figure Eight
description: >-
  Figure Eight (formerly CrowdFlower, and originally Dolores Labs) was a
  human-in-the-loop machine learning and artificial intelligence company founded
  in San Francisco in 2007 by Lukas Biewald and Chris Van Pelt. Its platform
  turned unlabeled text, image, audio, and video into high-quality AI training
  data by combining automation with a distributed contributor workforce. The
  company exposed a RESTful, key-authenticated JSON API for programmatically
  creating, configuring, launching, and monitoring annotation jobs and
  multi-step workflows, and for downloading aggregated judgments and reports.
  Figure Eight was acquired by Appen in March 2019 for up to $300M; by 2020 its
  assets were fully integrated into Appen and the API is now served as the Appen
  Platform API at api.appen.com. This profile captures that surviving API
  surface. figure-eight.com now redirects to appen.com.
